  <circle cx="85" cy="115" r="9" fill="#131F24" />
  <circle cx="82" cy="112" r="3.5" fill="#FFFFFF" />
  <circle cx="155" cy="115" r="18" fill="#FFFFFF" stroke="#D93B00" stroke-width="2.5" />
  <circle cx="155" cy="115" r="9" fill="#131F24" />
  <circle cx="152" cy="112" r="3.5" fill="#FFFFFF" />
