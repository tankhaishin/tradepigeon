<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="120" y1="40" x2="120" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7700" />
      <stop offset="60%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#D93B00" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="120" y1="75" x2="120" y2="180" gradientUnits="userSpaceOnUse">
